kind: List
apiVersion: v1
items:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: wrapped-in-list
      namespace: data-platform
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: wrapped-in-list
      template:
        metadata:
          labels:
            app: wrapped-in-list
        spec:
          securityContext:
            runAsNonRoot: true
          containers:
            - name: app
              image: example.com/app:1.0.0
              securityContext:
                allowPrivilegeEscalation: false
              resources:
                limits:
                  cpu: "500m"
                  memory: "512Mi"

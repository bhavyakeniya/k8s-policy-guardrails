apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource-limits-example
  namespace: data-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resource-limits-example
  template:
    metadata:
      labels:
        app: resource-limits-example
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: app
          image: example.com/app:1.0.0
          securityContext:
            allowPrivilegeEscalation: false

apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: legacy-agent
  template:
    metadata:
      labels:
        app: legacy-agent
    spec:
      hostNetwork: true
      containers:
        - name: agent
          image: example.com/legacy-agent:1.0.0
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
          env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/secrets/key.json

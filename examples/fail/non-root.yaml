apiVersion: apps/v1
kind: Deployment
metadata:
  name: non-root-example
  namespace: data-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: non-root-example
  template:
    metadata:
      labels:
        app: non-root-example
    spec:
      containers:
        - name: app
          image: example.com/app:1.0.0
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"

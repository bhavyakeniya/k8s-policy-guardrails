name: policy-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        # ubuntu covers linux/amd64 (what CI used to install inline);
        # macos-14 is Apple Silicon (arm64) - adding it here is what
        # actually exercises install-tools.sh's darwin/arm64 path for
        # real, instead of trusting a checksum nobody's CI run has ever
        # verified end-to-end.
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Calls the same script a local run uses, instead of duplicating
      # curl+checksum+install logic inline - confirmed as a real gap
      # before this: CI had its own hardcoded linux/amd64 install steps
      # that never touched install-tools.sh at all, so a bug in that
      # script's platform-detection or asset-naming could only ever be
      # caught on a contributor's own machine, never in CI.
      - name: Install opa/conftest/kubeconform (checksum-verified, same script local dev uses)
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          INSTALL_DIR="${RUNNER_TEMP}/bin" ./scripts/install-tools.sh

      - name: Run the same gates a local `scripts/verify.sh` run would
        run: ./scripts/verify.sh

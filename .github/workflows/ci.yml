name: policy-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  OPA_VERSION: "1.21.1"
  OPA_SHA256: "668506eb17a2eaa1fce6cc0d1f42ef85125d4ac5bda5fc74d1152d0c77145031"
  CONFTEST_VERSION: "0.71.1"
  CONFTEST_SHA256: "c3f6b2a753bd56e377a1e51a95ae3e057f926f2e9139f7d5b5dfbbaf810f7985"
  KUBECONFORM_VERSION: "0.8.0"
  KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
  # kubeconform defaults to -kubernetes-version master and a schema
  # location on its schema repo's mutable master branch - confirmed
  # directly against kubeconform's own docs: both defaults track moving
  # targets, so the same commit here could start passing or failing with
  # no change to this repository. Pinned to an exact Kubernetes version
  # and an immutable commit SHA of the schema repo instead. The version
  # itself must stay a currently-supported release, not just pinned -
  # 1.31 reached end of life 2025-11-11; confirmed directly (HTTP 200 on
  # the exact schema URL) that 1.37.1 is available at this same commit.
  KUBECONFORM_TARGET_K8S_VERSION: "1.37.1"
  KUBECONFORM_SCHEMA_COMMIT: "f7d855e49c34b039c9ef2196444910275e31e09e"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install OPA (checksum-verified)
        run: |
          curl -fsSL -o opa \
            "https://openpolicyagent.org/downloads/v${OPA_VERSION}/opa_linux_amd64_static"
          echo "${OPA_SHA256}  opa" | sha256sum -c -
          chmod +x opa
          sudo mv opa /usr/local/bin/opa

      - name: Install conftest (checksum-verified)
        run: |
          curl -fsSL -o conftest.tar.gz \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          echo "${CONFTEST_SHA256}  conftest.tar.gz" | sha256sum -c -
          tar -xzf conftest.tar.gz conftest
          chmod +x conftest
          sudo mv conftest /usr/local/bin/conftest

      - name: Install kubeconform (checksum-verified)
        run: |
          curl -fsSL -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz kubeconform
          chmod +x kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: kubeconform schema validation (structural only - see note)
        run: |
          # Catches wrong types, missing/unknown fields, bad apiVersions -
          # the policies below assume schema-valid input, this is what
          # makes that assumption true in CI. It does NOT validate
          # Kubernetes quantity string format (resources.limits.cpu/memory
          # are typed as plain strings in the OpenAPI schema with no
          # pattern constraint) - confirmed directly: kubeconform reports
          # cpu: "1garbage" as valid. require_resource_limits.rego's own
          # quantity_pattern regex is what actually catches that class of
          # mistake; kubeconform is a complementary, not overlapping,
          # layer.
          kubeconform -summary -strict \
            -kubernetes-version "${KUBECONFORM_TARGET_K8S_VERSION}" \
            -schema-location "https://raw.githubusercontent.com/yannh/kubernetes-json-schema/${KUBECONFORM_SCHEMA_COMMIT}/{{.NormalizedKubernetesVersion}}-standalone{{.StrictSuffix}}/{{.ResourceKind}}{{.KindSuffix}}.json" \
            examples/pass/*.yaml examples/fail/*.yaml

      - name: opa fmt check
        run: opa fmt --fail policy/ -d

      - name: opa check --strict
        run: opa check --strict policy/

      - name: Unit test every policy, enforce coverage on production files only
        run: |
          opa test policy/ -v
          opa test policy/ --coverage --format json > coverage.json
          python3 -c "
          import json
          d = json.load(open('coverage.json'))
          # The blended top-level 'coverage' field includes test files in
          # the denominator, and a test file is ~100% covered by
          # definition just by running - that blend is exactly what made
          # common.rego's real 68.97% look like an overall 96.95% before
          # the CronJob init-container gap in that one file got fixed.
          # Measuring production files only is the honest version of this
          # gate.
          #
          # covered/not_covered are arrays of EXPRESSION ranges (each with
          # a row/col start and end) - a single line can hold several
          # expressions, so len() on those arrays counts expression
          # regions, not lines. covered_lines/not_covered_lines are the
          # actual integer line counts OPA computes; confirmed by diffing
          # both against a deliberately-uncovered file before fixing this.
          covered = sum(c.get('covered_lines', 0) for f, c in d['files'].items() if not f.endswith('_test.rego'))
          total = sum(c.get('covered_lines', 0) + c.get('not_covered_lines', 0) for f, c in d['files'].items() if not f.endswith('_test.rego'))
          pct = 100 * covered / total if total else 100
          print(f'production-file coverage: {pct:.2f}% ({covered}/{total})')
          assert pct >= 95, f'production-file coverage {pct:.2f}% is below the 95% threshold'
          "

      - name: Assert exact per-policy fixture coverage
        run: |
          python3 scripts/assert_policy_coverage.py \
            --policy-dir policy \
            --fail-dir examples/fail \
            --map examples/fail/privileged.yaml=policies.privileged \
            --map examples/fail/privilege-escalation.yaml=policies.privilege_escalation \
            --map examples/fail/host-namespaces.yaml=policies.host_namespaces \
            --map examples/fail/non-root.yaml=policies.non_root \
            --map examples/fail/resource-limits.yaml=policies.resource_limits \
            --map examples/fail/static-gcp-key.yaml=policies.static_gcp_key \
            --map examples/fail/malformed-workload-identity-annotation.yaml=policies.static_gcp_key \
            --map examples/fail/list-input.yaml=policies.reject_list_input \
            --pass-glob 'examples/pass/*.yaml'

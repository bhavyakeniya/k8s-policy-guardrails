name: policy-ci

on:
  push:
    branches: [main]
  pull_request:

env:
  OPA_VERSION: "1.21.1"
  CONFTEST_VERSION: "0.71.1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OPA
        run: |
          curl -fsSL -o opa \
            "https://openpolicyagent.org/downloads/v${OPA_VERSION}/opa_linux_amd64_static"
          chmod +x opa
          sudo mv opa /usr/local/bin/opa

      - name: Install conftest
        run: |
          curl -fsSL -o conftest.tar.gz \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          tar -xzf conftest.tar.gz conftest
          chmod +x conftest
          sudo mv conftest /usr/local/bin/conftest

      - name: Unit test every policy (opa test)
        run: opa test policy/ -v

      - name: Every known-bad manifest must fail the gate, individually
        run: |
          status=0
          for f in examples/fail/*.yaml; do
            if conftest test --all-namespaces "$f" --policy policy; then
              echo "::error::$f was expected to violate policy but passed"
              status=1
            fi
          done
          exit $status

      - name: Known-good manifests must pass the gate
        run: conftest test --all-namespaces examples/pass/*.yaml --policy policy
